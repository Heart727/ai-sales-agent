# Copy to /etc/nginx/sites-available/ai-sales-agent after replacing SERVER_NAME.
# Keep port 8000 bound to localhost; expose only 80/443 in the cloud firewall.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    client_max_body_size 32k;
    client_body_timeout 15s;
    keepalive_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# After certbot issues a certificate, replace the HTTP server with the HTTPS
# block it generates, then set COOKIE_SECURE=true and PUBLIC_ORIGIN=https://SERVER_NAME.
