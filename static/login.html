<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- viewport：手机上按设备宽度渲染 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - AI 销售助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">

    <!-- 居中的登录卡片 -->
    <main class="auth-wrap">
        <div class="auth-layout">
            <section class="auth-showcase">
                <div class="showcase-logo"><span class="brand-mark">✦</span><span>AI SALES DESK</span></div>
                <div class="showcase-copy">
                    <span class="section-kicker">PRIVATE WORKSPACE</span>
                    <h1>把每一次<br><em>对话机会</em><br>变成下一步。</h1>
                    <p>AI 负责第一轮沟通，你专注于真正值得跟进的客户。</p>
                </div>
                <div class="showcase-footer"><span class="showcase-line"></span><span>销售工作台 · 仅限团队成员</span></div>
            </section>
            <section class="auth-card">
                <div class="auth-card-heading">
                    <span class="section-kicker">TEAM ACCESS</span>
                    <h2>欢迎回来</h2>
                    <p class="auth-sub">登录后管理你的客户线索</p>
                </div>

            <!-- 登录/注册 两个标签切换 -->
            <div class="auth-tabs">
                <button id="tabLogin" class="active">登录</button>
                <button id="tabRegister">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm">
                <input type="text" name="username" placeholder="用户名" autocomplete="username" required>
                <input type="password" name="password" placeholder="密码" autocomplete="current-password" required>
                <button type="submit" class="primary-btn">登 录</button>
            </form>

            <!-- 注册表单（默认隐藏） -->
            <form id="registerForm" hidden>
                <input type="text" name="username" placeholder="用户名（2~20 个字符）" autocomplete="username" required>
                <input type="password" name="password" placeholder="密码（至少 6 位）" autocomplete="new-password" required>
                <input type="text" name="signup_code" placeholder="注册邀请码（找管理员要）" required>
                <button type="submit" class="primary-btn">注册并登录</button>
            </form>

            <!-- 错误提示区 -->
            <div id="authError"></div>

                <a class="back-link" href="/"><span>←</span> 返回访客对话</a>
            </section>
        </div>
    </main>

    <script src="/static/login.js"></script>
</body>
</html>
