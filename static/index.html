<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- viewport 这行是"手机上能用"的关键：告诉手机浏览器按设备宽度渲染，别把桌面版缩小塞进屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 销售助手</title>
    <!-- 内嵌 emoji 图标：浏览器标签页小图标，不用单独放图片文件 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat-page">

    <!-- ===== 顶栏：标题 + 会话列表按钮 + 新对话 + 线索管理入口 ===== -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand-lockup">
                <button class="icon-btn" id="menuBtn" title="历史会话" aria-label="打开历史会话">☰</button>
                <span class="brand-mark" aria-hidden="true">✦</span>
                <div class="brand-copy">
                    <span class="eyebrow">AI SALES DESK</span>
                    <h1>智能销售助手</h1>
                </div>
            </div>
            <div class="topbar-actions">
                <span class="online-pill"><span></span>在线接待</span>
            <!-- 线索管理入口：默认隐藏，只有登录了的管理员才显示（访客不需要看到它） -->
            <a class="btn primary" id="leadsLink" href="/leads" hidden>线索管理</a>
                <button class="btn ghost" id="newChatBtn">新对话 <span class="shortcut">⌘ N</span></button>
            </div>
        </div>
    </header>

    <!-- ===== 历史会话抽屉（点 ☰ 滑出） ===== -->
    <div class="drawer-mask" id="drawerMask"></div>
    <aside class="drawer" id="drawer">
        <h2>历史会话</h2>
        <!-- 会话列表由 app.js 动态渲染 -->
        <div id="sessionList"></div>
    </aside>

    <!-- ===== 聊天区：消息由 app.js 动态渲染 ===== -->
    <main class="chat-area" id="chatArea" aria-live="polite"></main>

    <!-- ===== 底部输入栏 ===== -->
    <div class="composer">
        <div class="composer-inner">
            <!-- 结束对话按钮：手动生成线索卡片（AI 没自动生成时兜底） -->
            <button class="composer-more" id="endBtn" title="结束对话并生成线索">完成接待</button>
            <div class="composer-input-wrap">
                <span class="composer-spark" aria-hidden="true">✦</span>
                <!-- 输入框：按回车发送 -->
                <input id="msgInput" type="text" placeholder="告诉我你的需求，按 Enter 发送…" autocomplete="off">
            </div>
            <button class="send-btn" id="sendBtn" aria-label="发送消息">发送 <span>↗</span></button>
        </div>
        <p class="composer-hint">AI 会帮你梳理需求、预算和时间，结束后生成跟进摘要</p>
    </div>

    <!-- 错误/成功提示条 -->
    <div id="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
